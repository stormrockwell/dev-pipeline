# Runs the plugin evals a pull request can affect, once each, on the plan through CLAUDE_CODE_OAUTH_TOKEN.
# plugin/evals/affected.mjs picks the tags, so docs-only changes spend nothing.
# A manual run takes tags, or "all", for the final three-run numbers.
name: Evals

on:
  pull_request:
    paths:
      - 'plugin/**'
      - 'cli/src/**'
      - 'cli/bin/**'
      - 'cli/package.json'
      - 'tools/eval-bin/**'
  workflow_dispatch:
    inputs:
      tags:
        description: Eval tags separated by spaces, or "all".
        required: true
        default: all
        type: string
      runs:
        description: Runs per case.
        required: true
        default: '1'
        type: string

permissions:
  contents: read

# A newer push to the same PR makes the older run's results moot, so it stops spending.
concurrency:
  group: evals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    name: evals
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Pick the cases
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAGS: ${{ inputs.tags }}
          INPUT_RUNS: ${{ inputs.runs }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            tags="$INPUT_TAGS"
            runs="$INPUT_RUNS"
            [ "$tags" = all ] && tags="$(node plugin/evals/affected.mjs plugin/evals/run.mjs)"
          else
            tags="$(git diff --name-only "$BASE...$HEAD" | xargs node plugin/evals/affected.mjs)"
            runs=1
          fi
          case "$tags" in *[!a-z\ -]*) echo "::error::Tags take lower-case letters, spaces and hyphens only."; exit 1 ;; esac
          case "$runs" in ''|*[!0-9]*) echo "::error::Runs takes a number."; exit 1 ;; esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "runs=$runs" >> "$GITHUB_OUTPUT"
          echo "Tags: ${tags:-none}"

      - name: Check for the plan token
        id: token
        if: steps.pick.outputs.tags != ''
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::No CLAUDE_CODE_OAUTH_TOKEN secret, so the evals did not run."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Bubblewrap needs unprivileged user namespaces, which Ubuntu's AppArmor blocks by default. The runner is thrown away after the job.
      - name: Install the sandbox and Claude Code
        if: steps.token.outputs.ready == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          npm install -g @anthropic-ai/claude-code@2.1.322

      # ANTHROPIC_API_KEY would outrank the plan token, so the job never sets it.
      - name: Run the evals
        if: steps.token.outputs.ready == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TAGS: ${{ steps.pick.outputs.tags }}
          RUNS: ${{ steps.pick.outputs.runs }}
        run: |
          set -o pipefail
          status=0
          # shellcheck disable=SC2086
          node plugin/evals/run.mjs --runs "$RUNS" --model claude-sonnet-5-5 --judge-model claude-haiku-5-5 --max-cost-usd "$((10 * RUNS))" --tag $TAGS 2>&1 | tee evals.txt || status=$?
          {
            echo '### Evals'
            echo
            echo 'Cost is API-priced plan usage, not a charge.'
            echo
            echo '```'
            sed -n '/^CASE /,$p' evals.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
